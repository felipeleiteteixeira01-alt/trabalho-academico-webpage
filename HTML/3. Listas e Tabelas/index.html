<!DOCTYPE html>

<html lang = "pt-BR">

  <head>
    <meta charset = "UTF-8">
    <meta name = "viewport" content = "width = devide-width, initial-scale = 1.0">
    <title>Listas e Tabelas</title>
  </head>
    
  <body>
    
    <table border = "1">
    <caption>Tabela 1</caption>

      <thead>
        <tr>
          <th rowspan = "2" colspan = "2"></th>
          <th colspan = "5">Dia da Semana</th>
        </tr>
        <tr>
          <th>Segunda</th>
          <th>Terça</th>
          <th>Quarta</th>
          <th>Quinta</th>
          <th>Sexta</th>
        </tr>
      </thead>

      <tbody>
        <tr>
          <th rowspan = "3">Turno</th>
          <th>Manhã</th>
          <td>
            <ol>
              <li>Primeira Coisa</li>
              <li>Segunda Coisa</li>
              <li>Terceira Coisa</li>
            </ol>
          </td>
          <td></td>
          <td></td>
          <td></td>
          <td></td>
        </tr>
        <tr>
          <th>Tarde</th>
          <td></td>
          <td>
            <ul>
              <li>Item A</li>
              <li>Item B</li>
              <li>Item C</li>
            </ul>
          </td>
          <td></td>
          <td></td>
          <td></td>
        </tr>
        <tr>
          <th>Noite</th>
          <td></td>
          <td></td>
          <td>
            <ol>
              <li>Coisa 1</li>
              <li>
                Coisa 2
                <ul>
                  <li>Coisa 2.1</li>
                  <li>Coisa 2.2</li>
                </ul>
              </li>
              <li>Coisa 3</li>
            </ol>
          </td>
          <td></td>
          <td></td>
        </tr>
      </tbody>

    </table>
    
  </body>

</html>
